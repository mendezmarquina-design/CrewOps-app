<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fondo Azul Oscuro Operativo -->
  <rect width="512" height="512" rx="112" fill="#0b1326" />

  <!-- 1. RADAR EXTERIOR (FINO Y DISCRETO) -->
  <circle 
    cx="256" 
    cy="256" 
    r="190" 
    fill="none" 
